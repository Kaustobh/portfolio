<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    :root {
      --accent: #00F3FF; /* Default Cyan */
      --bg: #090D16;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --accent: #0066FF;
        --bg: #FFFFFF;
      }
    }
    .bg-shape { fill: var(--bg); }
    .accent-stroke { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>

  <!-- Background container for tab visibility -->
  <rect width="100" height="100" rx="22" class="bg-shape" />

  <!-- Octagonal Outer Ring -->
  <polygon points="30,12 70,12 88,30 88,70 70,88 30,88 12,70 12,30" 
           class="accent-stroke" 
           stroke-width="3" 
           stroke-dasharray="6 3" 
           opacity="0.4" />

  <!-- 'K' Glyph Element -->
  <path d="M 34 26 L 34 74 M 34 50 L 62 26 M 34 50 L 62 74" 
        class="accent-stroke" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'B' Outer Circuit Curve -->
  <path d="M 62 26 C 78 26, 78 48, 62 50 C 80 52, 80 74, 62 74" 
        stroke="#FF00A0" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Center Pulse Node -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
</svg>
